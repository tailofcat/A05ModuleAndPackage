[project]
name = "a05moduleandpackage"
version = "0.1.0"
description = "《模块与包》教学演示：用 playsound3 播放音频，演示装包、import 与调用 API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "playsound3>=3.3.2",
]

# 可选依赖组：仅用于准备音频素材，不参与演示运行。
# 安装：uv sync --group tools
[dependency-groups]
tools = [
    "you-get>=0.4.1743",
]
